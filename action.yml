name: 'Claude Audit'
description: 'AI-powered codebase auditor — security, quality, performance, architecture & more'
author: 'Shehryar Sohail'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Anthropic API key for AI-powered analysis (optional — runs static analysis without it)'
    required: false
  path:
    description: 'Path to the project to audit'
    required: false
    default: '.'
  categories:
    description: 'Comma-separated categories to audit (security,quality,performance,architecture,dependencies,testing,documentation)'
    required: false
  model:
    description: 'Claude model to use'
    required: false
    default: 'claude-sonnet-4-6'
  output:
    description: 'Output formats (terminal,markdown,html,json)'
    required: false
    default: 'json,markdown'
  max-files:
    description: 'Maximum files to scan'
    required: false
    default: '500'
  max-file-size:
    description: 'Maximum file size in KB'
    required: false
    default: '100'
  static:
    description: 'Run static analysis only (no AI)'
    required: false
    default: 'false'
  fail-on-critical:
    description: 'Fail the action if critical issues are found'
    required: false
    default: 'true'

outputs:
  score:
    description: 'Overall audit score (0-100)'
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: 'Overall grade (A/B/C/D/F)'
    value: ${{ steps.audit.outputs.grade }}
  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.audit.outputs.critical-count }}
  high-count:
    description: 'Number of high-severity findings'
    value: ${{ steps.audit.outputs.high-count }}
  total-findings:
    description: 'Total number of findings'
    value: ${{ steps.audit.outputs.total-findings }}
  report-json:
    description: 'Path to JSON report file'
    value: ${{ steps.audit.outputs.report-json }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Run Claude Audit
      id: audit
      shell: bash
      # Inputs are passed through the environment, never pasted into the script
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CATEGORIES: ${{ inputs.categories }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        INPUT_STATIC: ${{ inputs.static }}
        INPUT_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
        REPORT_DIR: ${{ runner.temp }}/claude-audit
      run: |
        # The outputs below are read from the JSON report, so always write one
        case ",$INPUT_OUTPUT," in
          *,json,*) ;;
          *) INPUT_OUTPUT="$INPUT_OUTPUT,json" ;;
        esac

        ARGS=("$INPUT_PATH" --quiet --output "$INPUT_OUTPUT" --output-dir "$REPORT_DIR"
          --model "$INPUT_MODEL" --max-files "$INPUT_MAX_FILES" --max-file-size "$INPUT_MAX_FILE_SIZE")
        if [ -n "$INPUT_CATEGORIES" ]; then
          ARGS+=(--categories "$INPUT_CATEGORIES")
        fi
        if [ "$INPUT_STATIC" = "true" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
          ARGS+=(--static)
        fi

        # Exit codes: 0 = passed, 1 = critical findings, 2 = the audit itself failed
        STATUS=0
        npx --yes claude-audit@latest "${ARGS[@]}" || STATUS=$?

        export REPORT="$REPORT_DIR/audit-report.json"
        if [ "$STATUS" -gt 1 ] || [ ! -f "$REPORT" ]; then
          echo "::error::Claude Audit did not produce a report (exit code $STATUS)."
          exit 1
        fi

        node -e '
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
          const outputs = {
            "score": r.overallScore,
            "grade": r.overallGrade,
            "critical-count": r.criticalCount,
            "high-count": r.highCount,
            "total-findings": r.allFindings.length,
            "report-json": process.env.REPORT,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            Object.entries(outputs).map(([k, v]) => `${k}=${v}\n`).join(""));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Claude Audit Report",
            "",
            "| Metric | Value |",
            "|--------|-------|",
            `| **Score** | ${r.overallScore}/100 |`,
            `| **Grade** | ${r.overallGrade} |`,
            `| **Critical** | ${r.criticalCount} |`,
            `| **High** | ${r.highCount} |`,
            `| **Total Findings** | ${r.allFindings.length} |`,
            `| **Mode** | ${r.aiPowered ? "AI" : "Static analysis only"} |`,
            "",
            ...(r.warnings || []).map(w => `> ⚠️ ${w}`),
            "",
          ].join("\n"));
        '

        if [ "$INPUT_FAIL_ON_CRITICAL" = "true" ] && [ "$STATUS" -eq 1 ]; then
          echo "::error::Claude Audit found critical issues. Failing the action."
          exit 1
        fi
