name: Publish to npm

# Runs when a GitHub Release is published. Uses npm Trusted Publishing (OIDC),
# so there is no npm token stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      # prepublishOnly builds and runs the tests first
      - name: Publish
        run: npm publish
