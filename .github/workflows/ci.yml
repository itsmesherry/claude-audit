name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx jest --runInBand

      - name: Run tests with coverage
        if: matrix.node-version == 24
        run: npx jest --coverage --runInBand

      - name: Verify package contents
        if: matrix.node-version == 24
        run: npm pack --dry-run

  action:
    # Runs action.yml the way a user's workflow would (static mode, published CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run the action
        id: audit
        uses: ./
        with:
          fail-on-critical: 'false'

      - name: Check the action's outputs
        env:
          SCORE: ${{ steps.audit.outputs.score }}
          REPORT: ${{ steps.audit.outputs.report-json }}
        run: |
          echo "score=$SCORE report=$REPORT"
          [[ "$SCORE" =~ ^[0-9]+$ ]]
          test -f "$REPORT"
